<!DOCTYPE html>
<html lang="vi">
<head>
	<title>Nhập dữ liệu và hiển thị với prompt và alert</title>
	<meta charset="utf-8">
	<!--<link href = "../css/style01.css" rel = "stylesheet">-->

</head>
<body>
	<script>
		let name = prompt("Tên  bạn là: ");
		let yob = Number(prompt("Bạn sinh năm: "));
		alert("Chào bạn " + name + "! Năm nay bạn " + (2026-yob) + " xuân xanh rồi đó!!!");
	</script>
</body>
</html>
